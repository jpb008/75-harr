name = "75hard-push-server"
main = "src/index.js"
compatibility_date = "2024-09-23"

# Runs hourly; the scheduled handler figures out which subscribers are
# in their 9pm/11pm local-time window and sends to those only.
[triggers]
crons = ["0 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "seventyfive-hard-push"
database_id = "REPLACE_WITH_YOUR_DATABASE_ID"

[vars]
# The contact URL/email push services may use if they need to reach you
# about this VAPID identity. Not secret — edit to your own.
VAPID_SUBJECT = "mailto:you@example.com"
